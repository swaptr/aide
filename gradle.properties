# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# JVM arguments for the daemon. 2 GB was the AS template default and never revisited: this build is 22
# modules with KSP, Room codegen and the Compose compiler, and R8 on the release path. Metaspace is capped
# explicitly because the Kotlin/KSP/AGP classloaders are what actually exhaust it, and the parallel GC costs
# less here than G1's concurrent cycles on a build that is one long burst of allocation.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# The Kotlin daemon inherits nothing from the above; without this it runs on its own default heap and is the
# first thing to OOM on a full build.
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m

# Parallel execution across modules. Safe now that the two Room KSP tasks no longer write the same schema
# directory concurrently (see data/build.gradle.kts and feature/tasks/build.gradle.kts).
org.gradle.parallel=true
# Local build cache: the same module compiled with the same inputs is not recompiled after a `clean` or a
# branch switch.
org.gradle.caching=true
# Configuration cache. The whole-tree tasks (moduleGraph, codeMap, codeMapCheck, dependencyDirectionCheck,
# schemaCheck) walk every project and opt out individually with
# `notCompatibleWithConfigurationCache(...)`; everything on the daily compile/test path is cached.
org.gradle.configuration-cache=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false