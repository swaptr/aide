spring.application.name=aide-server
server.port=8080

# --- Datasource -------------------------------------------------------------------------------------------
# Deliberately no url/username/password here:
#   dev  — spring-boot-docker-compose starts compose.yaml's `postgres` service and injects them.
#   test — TestcontainersConfiguration's @ServiceConnection bean injects them.
#   prod — SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD env vars.
# HikariCP is the pool (bundled with starter-data-jpa). Size it at the DB's connection budget, not at
# expected traffic: a blocking pool larger than the DB can serve just moves the queue.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.pool-name=aide-pool

# --- Schema (Flyway owns it) ------------------------------------------------------------------------------
# Migrations live in db/migration/V<n>__<name>.sql. Hibernate never writes DDL — `validate` makes a
# drifted entity fail at startup instead of silently at query time.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# --- JPA / Hibernate --------------------------------------------------------------------------------------
# open-in-view=false: no transaction/session held open through view rendering (Boot warns when it is on).
# Lazy access outside a @Transactional boundary then fails loudly here instead of in production.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Runtime --------------------------------------------------------------------------------------------
# JDK 21 virtual threads for request handling — the right default for a blocking (MVC + JDBC) server.
spring.threads.virtual.enabled=true

# --- Actuator -------------------------------------------------------------------------------------------
# Only health + info over HTTP. The readiness group includes `db`, so the probe fails while Postgres is
# unreachable; liveness stays up (the process is fine, its dependency is not).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
